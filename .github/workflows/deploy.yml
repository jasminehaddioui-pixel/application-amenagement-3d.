name: Déploiement GitHub Pages

on:
  push:
    branches:
      - main
      - claude/supermarket-layout-software-yj3xm9
  # Permet de relancer le déploiement à la main depuis l'onglet Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; les pushes suivants remplacent celui en cours.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Construction
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Vérification TypeScript et build de production
        run: npm run build

      - name: Préparation de l'artefact Pages
        uses: actions/configure-pages@v5

      - name: Envoi de l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Mise en ligne
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
