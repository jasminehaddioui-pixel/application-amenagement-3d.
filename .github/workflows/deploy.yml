name: Déploiement GitHub Pages

# Le déploiement se fait sur Vercel : ce workflow n'est plus déclenché
# automatiquement, mais reste disponible à la demande depuis l'onglet Actions
# si vous souhaitez publier aussi sur GitHub Pages.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; les pushes suivants remplacent celui en cours.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Construction
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Vérification TypeScript et build de production
        run: npm run build

      # Prérequis, à faire une seule fois : dans Settings > Pages du dépôt,
      # choisir « GitHub Actions » comme source. Le jeton du workflow n'a pas
      # le droit d'activer Pages lui-même. À noter : sur un dépôt privé, Pages
      # nécessite un abonnement GitHub payant ; sinon il faut rendre le dépôt
      # public, ou déployer sur Netlify / Vercel qui acceptent les dépôts privés.
      - name: Préparation de l'artefact Pages
        uses: actions/configure-pages@v5

      - name: Envoi de l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Mise en ligne
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
